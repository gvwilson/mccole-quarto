<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="$lang$" xml:lang="$lang$">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>$if(heading)$$heading$$else$$pagetitle$$endif$</title>
$for(css)$
  <link rel="stylesheet" href="$css$" />
$endfor$
$header-includes$
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>
<body>
<header class="topbar">
  <nav class="topnav">
    <a class="topnav-item" href="$home$">Home</a>
    <div class="topnav-dropdown">
      <span class="topnav-item">Chapters</span>
      <div class="topnav-menu">$chapters$</div>
    </div>
    <div class="topnav-dropdown">
      <span class="topnav-item">Appendices</span>
      <div class="topnav-menu">$appendices$</div>
    </div>
    <div class="topnav-dropdown">
      <span class="topnav-item$if(toc)$$else$ disabled$endif$">Contents</span>
$if(toc)$
      <div class="topnav-menu">$toc$</div>
$endif$
    </div>
$if(source)$
    <a class="topnav-item source" href="$source$">Source</a>
$endif$
  </nav>
</header>
<main class="content">
$body$
</main>
<footer class="page-footer">
  <nav class="pager">
    $if(prev)$$prev$$endif$
    $if(next)$$next$$endif$
  </nav>
</footer>
</body>
</html>
